spring:
  application:
    name: reviewing-V2

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  data:
    jpa:
      repositories:
        enabled: true
    elasticsearch:
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  ai:
    openai:
      embedding:
        options:
          model: text-embedding-3-large
          dimensions: 512
    vectorstore:
      elasticsearch:
        index-name: courses
        dimensions: 512
        initialize-schema: false

app:
  frontend-url: http://localhost:5173