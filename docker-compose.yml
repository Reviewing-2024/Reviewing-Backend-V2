services:
  app:
    image: ${DOCKER_USERNAME}/reviewing-v2:latest
    container_name: reviewing-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${RDS_HOST}:5432/reviewingV2
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_ELASTICSEARCH_URIS=http://${ES_HOST}:9200
      - SPRING_JWT_SECRET=${JWT_SECRET}
      - SPRING_AI_OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - SPRING_PROFILES_ACTIVE=prod
      - S3_BUCKET=${S3_BUCKET}
      - S3_BASE_URL=${S3_BASE_URL}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL_MONITOR=${SLACK_CHANNEL_MONITOR}
      - SLACK_CHANNEL_MEMBER=${SLACK_CHANNEL_MEMBER}
      - CHANNEL_TALK_SECRET_KEY=${CHANNEL_TALK_SECRET_KEY}
    restart: unless-stopped
